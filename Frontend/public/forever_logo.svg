<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>FOREVER Fashion Logo</title>
  <desc>Minimal luxury fashion logo featuring an F integrated with a clothes hanger.</desc>

  <g fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hanger hook -->
    <path d="M400 92 C400 55 454 55 454 96 C454 124 438 139 418 148" stroke-width="14"/>

    <!-- Hanger -->
    <path d="M418 148 C406 136 394 136 382 148 L248 228
             C232 238 239 257 257 257
             L400 176
             L543 257
             C561 257 568 238 552 228
             L418 148" stroke-width="16"/>
  </g>

  <!-- Stylized F -->
  <path fill="#111111" d="
    M328 236
    C328 222 338 214 353 214
    L494 214
    L494 268
    L390 268
    L390 330
    L478 330
    L478 380
    L390 380
    L390 516
    C390 542 402 554 432 558
    L432 574
    L310 574
    L310 558
    C326 554 332 543 332 516
    Z"/>

  <!-- Flowing fabric/swoosh -->
  <path fill="#111111" d="
    M255 470
    C290 426 355 408 390 365
    C414 336 426 302 420 270
    C443 314 437 365 410 399
    C375 443 310 459 270 510
    C253 532 247 548 250 565
    C228 535 230 502 255 470 Z"/>

  <!-- FOREVER wordmark -->
  <text x="400" y="665"
        text-anchor="middle"
        fill="#111111"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82"
        font-weight="700"
        letter-spacing="14">FOREVER</text>

  <!-- Tagline -->
  <g fill="#111111">
    <rect x="150" y="708" width="82" height="2"/>
    <rect x="568" y="708" width="82" height="2"/>
  </g>
  <text x="400" y="715"
        text-anchor="middle"
        fill="#111111"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="500"
        letter-spacing="7">FASHION FOR EVERY YOU</text>
</svg>
